services:
  m4brew:
    build: .
    container_name: m4brew
    networks:
      - matflix
    restart: unless-stopped
    ports:
      - "8586:8080"
    labels:
      net.unraid.docker.icon: http://192.168.4.10:8586/static/images/m4brew-logo.png
      net.unraid.docker.webui: http://[IP]:[PORT:8080]
    environment:
      # Set AUTH_PASSWORD to enable HTTP Basic Auth
      # AUTH_PASSWORD: changeme
      # Set SECRET_KEY to a fixed value to survive restarts without /config volume
      # SECRET_KEY: changeme
      # UID/GID the app runs as (adjust to match ownership of your mounted folders)
      PUID: 1026
      PGID: 100
      # Umask for files the app creates, e.g. converted .m4b output (default 022 = 644 files).
      # Must be quoted - YAML parses an unquoted leading-zero number as octal.
      # UMASK: "000"
    volumes:
      - /mnt/remotes/192.168.4.4_media/Audiobooks:/DSM_Audiobooks:slave
      - /mnt/cache/media/Audiobooks:/Test_Folder:slave
      - /mnt/cache/media/Chaptarr/Audiobooks:/Chaptarr:slave
      - ./config:/config

networks:
  matflix:
    external: true
