services:
  m4brew:
    build: .
    container_name: m4brew
    restart: unless-stopped
    user: "1026:100"
    ports:
      - "8586:8080"
    labels:
      net.unraid.docker.icon: http://192.168.4.10:8586/static/icons/web-app-manifest-512x512.png
      net.unraid.docker.webui: http://[IP]:[PORT:8080]
    environment:
      # Set AUTH_PASSWORD to enable HTTP Basic Auth
      # AUTH_PASSWORD: changeme
      # Set SECRET_KEY to a fixed value to survive restarts without /config volume
      # SECRET_KEY: changeme
      PUID: 1026
      PGID: 100
    volumes:
      - /mnt/remotes/192.168.4.4_media/Audiobooks:/DSM_Audiobooks
      - /mnt/cache/media/Audiobooks:/Test_Folder
      - /mnt/cache/media/Chaptarr/Audiobooks:/Chaptarr
      - ./config:/config
networks:
  default:
    name: matt-net
    external: true
