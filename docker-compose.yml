services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: m4brew-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      PING: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  m4brew:
    build: .
    container_name: m4brew
    restart: unless-stopped
    user: "1026:100"
    ports:
      - "8586:8080"
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/MATXBY/m4brew/master/app/static/icons/web-app-manifest-512x512.png
      net.unraid.docker.webui: http://[IP]:[PORT:8080]
    environment:
      # Set AUTH_PASSWORD to enable HTTP Basic Auth
      # AUTH_PASSWORD: changeme
      # Set SECRET_KEY to a fixed value to survive restarts without /config volume
      # SECRET_KEY: changeme
      PUID: 1026
      PGID: 100
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - /mnt/remotes/192.168.4.4_media/Audiobooks:/audiobooks
      - /mnt/cache/media/Audiobooks:/audiobooks2
      - ./config:/config
    networks:
      - socket-proxy
    depends_on:
      - socket-proxy

networks:
  socket-proxy:
    driver: bridge
