name: Publish to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'entrypoint.sh'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=APP_VERSION = ")[^"]+' app/web.py)
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check secrets (lengths only)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: for v in DH_USER DH_TOKEN; do val="${!v}"; echo "$v len=${#val} odd_bytes=$(printf '%s' "$val" | LC_ALL=C tr -d '\041-\176' | wc -c) starts=${val:0:5}"; done


      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DH_TOKEN" | tr -d '[:space:]' | docker login -u "$(printf '%s' "$DH_USER" | tr -d '[:space:]')" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            matxby/m4brew:${{ steps.version.outputs.version }}
            matxby/m4brew:latest
